# Ruff — yalnızca Python kalan kısımlar: sözleşme testleri (tests/contract) ve geliştirme
# araçları (tools/, plugins/username-search/tools). Uygulama kodu Rust'tadır.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # satır uzunluğu bilinçli kapalı (URL/SQL okunabilirliği)
]
