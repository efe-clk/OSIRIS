# OSIRIS Web UI — imaj içi statik sunucu (3000). Dış erişim deploy/nginx/nginx.conf /ui/ üzerinden.
# Uygulama HashRouter kullanır: sunucu tarafı yönlendirme gerekmez, bilinmeyen yol index.html'e düşer.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    # Dış nginx proxy_pass varsayılan olarak HTTP/1.0 konuşur; onda da sıkıştır
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite çıktısı içerik özetli adlar taşır → uzun önbellek
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html her yüklemede yeniden doğrulanır (yeni sürüm hemen görünür)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
