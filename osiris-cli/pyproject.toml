[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-cli"
version = "0.1.0"
description = "OSIRIS komut satırı arayüzü"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
# R6: `osiris` adı Rust CLI'nindir (crates/osiris-cli); Python sürümü R7'de silinir
osiris-py = "osiris_cli.cli:main"

[tool.setuptools.packages.find]
include = ["osiris_cli*"]
