# Python paketi: osiris-native (modül adı osiris_native). Kurulum: pip install ./crates/osiris-py
# (Rust araç zinciri gerekir; sürüm repo kökündeki rust-toolchain.toml'dan gelir.)
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "osiris-native"
version = "0.1.0"
description = "OSIRIS Rust çekirdeği: güvenlik (SSRF), content_hash/audit, regex varlık çıkarma"
requires-python = ">=3.11"
license = "GPL-3.0-only"

[tool.maturin]
module-name = "osiris_native"
profile = "release"
