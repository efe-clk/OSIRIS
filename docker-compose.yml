# OSIRIS — Docker Compose
# Self-host altyapı servis haritası (bkz. doküman §11.2)
# Varsayılan olarak yalnızca temel veri katmanı başlatılır.

name: osiris

# Ortak varsayılanlar: log rotasyonu (disk DoS koruması) + bellek tavanları
# (VDS paylaşımlı — komşu projeleri korur; değerler cömert tavanlardır)
x-defaults:
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# OSIRIS hizmetlerinin ortak ayarları (tek imaj, alt komutla seçilir)
x-osiris-env: &osiris-env
  OSIRIS_DATABASE_URL: postgresql://osiris:${POSTGRES_PASSWORD:-osiris_dev_password}@postgresql:5432/osiris
  OSIRIS_REDIS_URL: redis://redis:6379/0
  OSIRIS_RETENTION_DAYS: ${OSIRIS_RETENTION_DAYS:-180}
  OSIRIS_LOG_FORMAT: json
  # Karanlık ağ proxy'leri (yalnızca darknet profili açıksa çalışır)
  OSIRIS_TOR_SOCKS: ${OSIRIS_TOR_SOCKS:-tor:9050}
  OSIRIS_I2P_HTTP_PROXY: ${OSIRIS_I2P_HTTP_PROXY:-i2pd:4444}

x-osiris-service: &osiris-service
  image: osiris:1.0.0-rc
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: osiris-postgresql
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging
    environment:
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osiris_dev_password}
      POSTGRES_DB: osiris
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Yalnizca localhost (konteynerler ic agi kullanir; dis erisim SSH tuneli)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: osiris-redis
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      # Yalnizca localhost — kimliksiz Redis disari acilmaz (kuyruk zehirleme riski)
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  n8n:
    image: n8nio/n8n:1.114.4
    container_name: osiris-n8n
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-osiris_dev_password}
      # OSIRIS workflow'larinin API cagrilari icin ({{ $env.OSIRIS_API_KEY }})
      OSIRIS_API_KEY: ${OSIRIS_API_KEY:-}
      # Ifadelerde $env erisimi (n8n surumu varsayilani degistirse de acik kalsin)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      # Yalnizca localhost (n8n arayuzu nginx /n8n uzerinden)
      - "127.0.0.1:5678:5678"


  # --- Karanlık ağ proxy'leri (profil: darknet) -------------------------------
  # Yalnızca iç ağ: host'a port yayınlanmaz. tor/i2p plugin'leri bu adreslere
  # OSIRIS_TOR_SOCKS / OSIRIS_I2P_HTTP_PROXY ile yönlenir (kullanıcı config'i
  # başka bir proxy host'u seçemez). Başlatma: docker compose --profile darknet up -d
  tor:
    build:
      context: ./deploy/tor
    image: osiris-tor:0.1.0
    container_name: osiris-tor
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    volumes:
      - tordata:/var/lib/tor
    profiles: ["darknet"]

  i2pd:
    image: purplei2p/i2pd:release-2.61.0
    container_name: osiris-i2pd
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    command:
      - --httpproxy.address=0.0.0.0
      - --httpproxy.port=4444
      - --socksproxy.enabled=false
      - --http.address=127.0.0.1
      - --sam.enabled=false
      - --bob.enabled=false
      - --i2cp.enabled=false
      - --i2pcontrol.enabled=false
    volumes:
      - i2pddata:/home/i2pd/data
    profiles: ["darknet"]

  # NOT: nginx.conf bu servis adlarına proxy yapar; tanımsız bırakılırsa
  # nginx DNS çözümlemede başarısız olur. Profillerle isteğe bağlı başlatılır.
  # --- OSIRIS (Rust, tek imaj) ----------------------------------------------------
  # REST API — Nginx /api/* ve n8n bu servise (osiris-api:8000) gider. Prometheus ölçümleri
  # yalnızca iç ağda: osiris-api:9464/metrics (host'a yayınlanmaz).
  osiris-api:
    <<: *osiris-service
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: osiris-api
    # Semantik arama sorgu vektörünü API üretir (embedding modeli ~120 MB, ilk aramada yüklenir)
    mem_limit: 1g
    command: ["api", "--addr", "0.0.0.0:8000"]
    environment:
      <<: *osiris-env
      OSIRIS_API_KEY: ${OSIRIS_API_KEY:-}
      OSIRIS_JWT_SECRET: ${OSIRIS_JWT_SECRET:-}
      OSIRIS_INSECURE_OPEN: ${OSIRIS_INSECURE_OPEN:-}
      OSIRIS_API_RATE_PER_MIN: ${OSIRIS_API_RATE_PER_MIN:-600}
      OSIRIS_METRICS_ADDR: 0.0.0.0:9464
      OSIRIS_CORS_ORIGINS: ${OSIRIS_CORS_ORIGINS:-http://localhost:3000}
      # /search/semantic: işçiyle aynı model (modeller yoksa uç 503 döner, API çalışmaya devam eder)
      OSIRIS_EMBEDDING_MODEL: ${OSIRIS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "osiris-server", "health", "--addr", "127.0.0.1:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # Yalnızca localhost (dış erişim nginx üzerinden). 8000 dolu olabilir.
      - "127.0.0.1:8001:8000"
    profiles: ["api", "full"]

  # Kuyruk işçisi — osiris:stream:raw_items'i tüketir, DB'ye yazar, saklama süresi dolan
  # öğeleri siler (OSIRIS_RETENTION_DAYS!). NER/embedding için önce modeller (osiris-models).
  osiris-pipeline:
    <<: *osiris-service
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: osiris-pipeline
    mem_limit: 2g
    command: ["pipeline", "--loop", "--interval", "5", "--batch", "50"]
    environment:
      <<: *osiris-env
      OSIRIS_EMBEDDING_MODEL: ${OSIRIS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      OSIRIS_RETENTION_INTERVAL: ${OSIRIS_RETENTION_INTERVAL:-3600}
      OSIRIS_PIPELINE_CONSUMER: osiris-pipeline-1
    volumes:
      - ./models:/app/models:ro
    profiles: ["worker", "full"]

  # Collector — sources.schedule'a göre toplar. Zamanlama VARSAYILAN KAPALI:
  # kaynakların schedule değerlerini gözden geçirdikten sonra OSIRIS_SCHEDULER=on.
  osiris-collector:
    <<: *osiris-service
    container_name: osiris-collector
    mem_limit: 512m
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      osiris-pipeline:
        condition: service_started
    command: ["collector"]
    environment:
      <<: *osiris-env
      OSIRIS_SCHEDULER: ${OSIRIS_SCHEDULER:-off}
    profiles: ["worker", "full"]

  # ONNX modellerini indirir/doğrular (tek seferlik): docker compose --profile models run --rm osiris-models
  # ./models dizinine host kullanıcısıyla yazar (OSIRIS_UID/OSIRIS_GID, varsayılan 1000).
  osiris-models:
    image: osiris:1.0.0-rc
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    user: "${OSIRIS_UID:-1000}:${OSIRIS_GID:-1000}"
    command: ["models", "--dir", "/app/models"]
    volumes:
      - ./models:/app/models
    profiles: ["models"]

  osiris-web-ui:
    build:
      context: ./osiris-web-ui
    image: osiris-web-ui:1.0.0-rc
    container_name: osiris-web-ui
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      - osiris-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # Yalnızca localhost (dış erişim nginx /ui üzerinden).
      - "127.0.0.1:3001:3000"
    profiles: ["ui", "full"]

  nginx:
    image: nginx:1.31-alpine
    container_name: osiris-nginx
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      - postgresql
      - redis
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      # 443 bu makinede dolu → TLS 8443'te (bkz. nginx.conf)
      - "8443:8443"

volumes:
  pgdata:
  redisdata:
  n8ndata:
  tordata:
  i2pddata:
