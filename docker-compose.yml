# OSIRIS — Docker Compose
# Self-host altyapı servis haritası (bkz. doküman §11.2)
# Varsayılan olarak yalnızca temel veri katmanı başlatılır.

name: osiris

# Ortak varsayılanlar: log rotasyonu (disk DoS koruması) + bellek tavanları
# (VDS paylaşımlı — komşu projeleri korur; değerler cömert tavanlardır)
x-defaults:
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: osiris-postgresql
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging
    environment:
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osiris_dev_password}
      POSTGRES_DB: osiris
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Yalnizca localhost (konteynerler ic agi kullanir; dis erisim SSH tuneli)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: osiris-redis
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      # Yalnizca localhost — kimliksiz Redis disari acilmaz (kuyruk zehirleme riski)
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Quay (Docker Hub reposu tasindi) — calisan surume sabitli
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: osiris-minio
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-osiris}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-osiris_dev_password}
    volumes:
      - miniodata:/data
    ports:
      # Yalnizca localhost (konsol/API disari acilmaz)
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  n8n:
    image: n8nio/n8n:1.114.4
    container_name: osiris-n8n
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-osiris_dev_password}
      # OSIRIS workflow'larinin API cagrilari icin ({{ $env.OSIRIS_API_KEY }})
      OSIRIS_API_KEY: ${OSIRIS_API_KEY:-}
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      # Yalnizca localhost (n8n arayuzu nginx /n8n uzerinden)
      - "127.0.0.1:5678:5678"

  freshrss:
    image: freshrss/freshrss:1.24.0
    container_name: osiris-freshrss
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    environment:
      TZ: UTC
      CRON_MIN: "*/5"
    volumes:
      - freshrssdata:/var/www/FreshRSS/data
    ports:
      # Yalnizca localhost (okuyucu nginx /rss uzerinden)
      - "127.0.0.1:8080:80"

  # NOT: nginx.conf bu servis adlarına proxy yapar; tanımsız bırakılırsa
  # nginx DNS çözümlemede başarısız olur. Profillerle isteğe bağlı başlatılır.
  osiris-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    image: osiris-api:0.1.0
    container_name: osiris-api
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OSIRIS_DATABASE_URL: postgresql://osiris:${POSTGRES_PASSWORD:-osiris_dev_password}@postgresql:5432/osiris
      OSIRIS_REDIS_URL: redis://redis:6379/0
      OSIRIS_API_KEY: ${OSIRIS_API_KEY:-}
      OSIRIS_JWT_SECRET: ${OSIRIS_JWT_SECRET:-}
      OSIRIS_INSECURE_OPEN: ${OSIRIS_INSECURE_OPEN:-}
      OSIRIS_RETENTION_DAYS: ${OSIRIS_RETENTION_DAYS:-180}
      OSIRIS_CORS_ORIGINS: http://localhost:3000
    ports:
      # Yalnızca localhost (dış erişim nginx üzerinden). 8000 dolu olabilir.
      - "127.0.0.1:8001:8000"
    profiles: ["api", "full"]

  osiris-web-ui:
    build:
      context: ./osiris-web-ui
    image: osiris-web-ui:0.1.0
    container_name: osiris-web-ui
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      - osiris-api
    ports:
      # Yalnızca localhost (dış erişim nginx /ui üzerinden).
      - "127.0.0.1:3001:3000"
    profiles: ["ui", "full"]

  nginx:
    image: nginx:1.31-alpine
    container_name: osiris-nginx
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      - postgresql
      - redis
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      # 443 bu makinede dolu → TLS 8443'te (bkz. nginx.conf)
      - "8443:8443"

volumes:
  pgdata:
  redisdata:
  miniodata:
  n8ndata:
  freshrssdata:
