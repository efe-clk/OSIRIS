# OSIRIS Rust çalışma alanı (docs/RUST_GECIS_PLANI.md §2).
# Crate'ler crates/ altındadır; Python köprüsü crates/osiris-py (maturin) geçiş dönemi içindir.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/efe-clk/OSIRIS"
publish = false

[workspace.dependencies]
osiris-hash = { path = "crates/osiris-hash" }
osiris-extract = { path = "crates/osiris-extract" }
osiris-security = { path = "crates/osiris-security" }
osiris-types = { path = "crates/osiris-types" }
osiris-plugin = { path = "crates/osiris-plugin" }
osiris-plugins = { path = "crates/osiris-plugins" }
osiris-feed = { path = "crates/osiris-feed" }
osiris-db = { path = "crates/osiris-db" }
osiris-pipeline = { path = "crates/osiris-pipeline" }
osiris-queue = { path = "crates/osiris-queue" }
osiris-collector = { path = "crates/osiris-collector" }
osiris-graph = { path = "crates/osiris-graph" }
osiris-report = { path = "crates/osiris-report" }
osiris-alert = { path = "crates/osiris-alert" }
osiris-query = { path = "crates/osiris-query" }
ammonia = "4.2.4"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = "4.0.1"
encoding_rs = "0.8.42"
fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
futures = "0.3.34"
hickory-resolver = "0.26.3"
indexmap = "2.14.2"
jsonschema = { version = "0.59.0", default-features = false }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
lingua = { version = "1.8.0", default-features = false, features = ["arabic", "chinese", "dutch", "english", "french", "german", "italian", "japanese", "korean", "persian", "polish", "portuguese", "russian", "spanish", "turkish", "ukrainian"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
redis = { version = "1.7.1", default-features = false, features = ["streams", "tokio-comp", "aio", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks", "http2", "charset", "gzip", "deflate"] }
schemars = "1.2.3"
tempfile = "3.27.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["v4"] }
fancy-regex = "0.19.2"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
regex = "1.13.1"
ryu = "1.0.23"
ryu-js = "1.0.3"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
