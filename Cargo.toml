# OSIRIS Rust çalışma alanı (docs/RUST_GECIS_PLANI.md §2).
# Crate'ler crates/ altındadır; Python köprüsü crates/osiris-py (maturin) geçiş dönemi içindir.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/efe-clk/OSIRIS"
publish = false

[workspace.dependencies]
osiris-hash = { path = "crates/osiris-hash" }
osiris-extract = { path = "crates/osiris-extract" }
osiris-security = { path = "crates/osiris-security" }
fancy-regex = "0.19.2"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
regex = "1.13.1"
ryu = "1.0.23"
ryu-js = "1.0.3"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
