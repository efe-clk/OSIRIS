# cargo-deny — lisans, güvenlik danışmaları (RustSec), yasaklı/çift sürüm ve kaynak denetimi.
# CI: EmbarkStudios/cargo-deny-action. Yerel: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: bakım dışı (güvenlik açığı değil); tokenizers → fastembed zincirinden gelir,
    # güvenli sürümü yok. Tokenizers değiştirince kaldırılmalı.
    { id = "RUSTSEC-2024-0436", reason = "tokenizers bağımlılığı, alternatif yok (R5)" },
]

[licenses]
version = 2
# GPL-3.0 projeyle uyumlu izinli lisanslar
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# publish = false çalışma alanı crate'leri (GPL-3.0-only) denetim dışı
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
