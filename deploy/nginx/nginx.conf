# OSIRIS — Nginx ters proxy yapılandırması
# Ağ topolojisi için bkz. doküman §11.3

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    # Gövde tavanı: dev API JSON sınırlarıyla uyumlu (istemci OOM koruması)
    client_max_body_size 5m;

    # Temel güvenlik başlıkları
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    # TLS aktif (8443) — yalnızca HTTPS yanıtlarında işler, HTTP'de yoksayılır
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basit hız sınırlama (kaba kuvvet / tarama koruması)
    limit_req_zone $binary_remote_addr zone=osiris_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=osiris_login:10m rate=2r/s;

    # API Gateway
    upstream osiris_api {
        server osiris-api:8000;
    }

    server {
        listen 80;
        # 443 dolu (baska reverse proxy) → TLS 8443'te. Alan adı + gerçek
        # sertifika edinince compose'da 443:8443 yapıp server_name güncelleyin.
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/osiris.local.crt;
        ssl_certificate_key /etc/nginx/certs/osiris.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 10m;

        # /api/* → osiris-api (R6: Rust osiris-server api; /api öneki sıyrılır:
        # /api/search → /search, çünkü API rotaları öneksiz tanımlı).
        # Python API'ye geri dönüş: api-python profili osiris-api adını devralır (nginx yeniden başlatılır).
        location /api/ {
            limit_req zone=osiris_api burst=20 nodelay;
            proxy_pass http://osiris_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # /n8n/* → n8n
        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /ui/* → osiris-web-ui
        location /ui/ {
            proxy_pass http://osiris-web-ui:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
