[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-pipeline"
version = "0.1.0"
description = "OSIRIS Processing Pipeline — temizleme, NER, sınıflandırma, embedding"
requires-python = ">=3.11"
dependencies = [
    "osiris-sdk>=0.1.0",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "beautifulsoup4>=4.12",
    "langdetect>=1.0",
]

[project.optional-dependencies]
# Semantik embedding — fastembed (ONNX, torch YOK; model ~220 MB ilk kullanımda iner).
# pip install "osiris-pipeline[embedding]"  ·  model: OSIRIS_EMBEDDING_MODEL
embedding = ["fastembed>=0.8.1,<0.10"]
# ONNX NER (kişi/kurum/yer) — model: python models/download.py --only ner
ner = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "numpy>=1.26"]

[project.scripts]
osiris-pipeline = "osiris_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["osiris_pipeline*"]
