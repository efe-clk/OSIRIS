name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-tests:
    name: Python testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: |
          pip install -e ./osiris-sdk
          pip install -e ./osiris-collector
          pip install -e "./osiris-pipeline[ner]"
          pip install -e ./osiris-graph
          pip install -e ./osiris-alert
          pip install -e ./osiris-report
          pip install -e ./osiris-query
          pip install -e ./osiris-api
          pip install -e ./osiris-cli
          pip install pytest pytest-cov httpx jsonschema
      - name: Rust çekirdeği (osiris_native, PyO3) — rust-toolchain.toml sürümüyle derlenir
        run: |
          rustup toolchain install
          pip install ./crates/osiris-py
      - name: Plugin bağımlılıkları
        run: |
          for req in plugins/*/requirements.txt; do pip install -r "$req"; done
      - name: Üretilmiş tablolar güncel mi (bs4 → content_hash, feedparser → rss)
        run: |
          python tools/gen_html_tables.py --check
          python tools/gen_feed_tables.py --check
      - name: Testleri çalıştır — Rust yolu (varsayılan, %80 kapsam eşiği)
        run: |
          pytest -q \
            --cov=osiris --cov=osiris_collector --cov=osiris_pipeline \
            --cov=osiris_graph --cov=osiris_alert --cov=osiris_report \
            --cov=osiris_query --cov=osiris_api --cov=osiris_cli \
            --cov-report=term-missing --cov-fail-under=80
      - name: Testleri çalıştır — Python referans yolu (OSIRIS_NATIVE=python)
        env:
          OSIRIS_NATIVE: python
        run: pytest -q

  integration:
    name: Entegrasyon (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: osiris
          POSTGRES_PASSWORD: osiris
          POSTGRES_DB: osiris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osiris" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      OSIRIS_TEST_DATABASE_URL: postgresql://osiris:osiris@localhost:5432/osiris_test
      OSIRIS_TEST_REDIS_URL: redis://localhost:6379/1
      PGPASSWORD: osiris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Migration'ları uygula (iki kez — tekrar çalıştırılabilirlik)
        run: |
          psql -h localhost -U osiris -d osiris_test -qc "CREATE DATABASE osiris_rust_test"
          for db in osiris_test osiris_rust_test; do
            for pass in 1 2; do
              for f in db/migrations/*.sql; do
                psql -h localhost -U osiris -d "$db" -v ON_ERROR_STOP=1 -q -f "$f"
              done
            done
          done
      - name: ONNX modelleri (önbellekli; sabit revizyon + özet doğrulaması)
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-${{ hashFiles('models/download.py') }}
      - name: Modelleri indir / doğrula
        run: python models/download.py
      - name: Bağımlılıkları kur
        run: |
          pip install -e ./osiris-sdk -e ./osiris-collector -e "./osiris-pipeline[embedding,ner]" \
            -e ./osiris-graph -e ./osiris-query -e ./osiris-alert -e ./osiris-report \
            -e ./osiris-api uvicorn jsonschema -r tests/contract/requirements.txt
          rustup toolchain install
          pip install ./crates/osiris-py
          for req in plugins/*/requirements.txt; do pip install -r "$req"; done
      - uses: Swatinem/rust-cache@v2
      - name: Rust servis ikilisi (osiris-server) + Rust model fixture'ları (NER, embedding)
        env:
          OSIRIS_MODEL_DIR: models
          OSIRIS_REQUIRE_MODELS: "1"
        run: |
          cargo build --release --locked -p osiris-server
          cargo test --release --locked -p osiris-pipeline --test models
      - name: Entegrasyon + model golden testleri (NER, embedding)
        env:
          OSIRIS_MODEL_DIR: models
          HF_HUB_OFFLINE: "1"
          OSIRIS_REQUIRE_MODELS: "1"
          OSIRIS_TEST_RUST_DATABASE_URL: postgresql://osiris:osiris@localhost:5432/osiris_rust_test
          OSIRIS_SERVER_BIN: target/release/osiris-server
          OSIRIS_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        run: |
          pytest -q tests/integration -rs
          pytest -q tests/golden -k "ner or embedding or models_present" -rs
      - name: Sözleşme (kara kutu) testleri — gerçek API'ye karşı
        env:
          OSIRIS_API_KEY: ci-contract-admin-key-0123456789abcdef
          OSIRIS_JWT_SECRET: ci-contract-jwt-secret-0123456789abcdef
          OSIRIS_DATABASE_URL: postgresql://osiris:osiris@localhost:5432/osiris_test
          OSIRIS_REDIS_URL: redis://localhost:6379/0
          OSIRIS_BASE_URL: http://127.0.0.1:8000
          OSIRIS_CONTRACT_API_KEY: ci-contract-admin-key-0123456789abcdef
          OSIRIS_CONTRACT_DESTRUCTIVE: "1"
        run: |
          uvicorn osiris_api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          pytest -q tests/contract || { cat api.log; exit 1; }

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff kur
        run: pip install ruff
      - name: Lint çalıştır
        run: ruff check osiris-sdk osiris-collector osiris-pipeline osiris-graph osiris-alert osiris-report osiris-query osiris-api osiris-cli plugins tests tools
      - name: Döküman link kontrolü
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path
          bad = []
          for f in [*Path('.').glob('README*.md'), *Path('docs').glob('*.md')]:
              # Kod blokları ve satır içi kod bağlantı değildir (regex vb. yanlış pozitif verir)
              text = re.sub(r'```.*?```', '', f.read_text(), flags=re.S)
              text = re.sub(r'`[^`\n]*`', '', text)
              for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  link = m.group(1)
                  if link.startswith(('http', '#', 'mailto:')):
                      continue
                  if not (f.parent / link).exists():
                      bad.append(f'{f} -> {link}')
          if bad:
              raise SystemExit('Kırık linkler:\n' + '\n'.join(bad))
          print('Döküman linkleri OK')
          EOF

  security-audit:
    name: Güvenlik denetimi (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit kur ve çalıştır
        run: |
          pip install pip-audit
          pip-audit --desc --local --skip-editable || true

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pyo3-build-config (osiris-py) clippy sırasında Python ≥ 3.11 yorumlayıcısı arar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Araç zinciri (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Biçim
        run: cargo fmt --all --check
      - name: Clippy (uyarı = hata)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testler (fixtures/ altın verileri dahil)
        run: cargo test --workspace --exclude osiris-py --locked

  cargo-deny:
    name: Rust bağımlılık denetimi (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  web-ui-build:
    name: Web UI derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bağımlılıkları kur
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: osiris-web-ui
      - name: Derle
        run: npm run build
        working-directory: osiris-web-ui
      - name: Güvenlik denetimi (npm audit)
        run: npm audit --omit=dev
        working-directory: osiris-web-ui
