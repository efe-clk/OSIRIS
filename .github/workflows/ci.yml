name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Araç zinciri (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Biçim
        run: cargo fmt --all --check
      - name: Clippy (uyarı = hata)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testler (fixtures/ altın verileri dahil)
        run: cargo test --workspace --locked

  integration:
    name: Entegrasyon (PostgreSQL + Redis + modeller + sözleşme)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: osiris
          POSTGRES_PASSWORD: osiris
          POSTGRES_DB: osiris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osiris" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      OSIRIS_TEST_DATABASE_URL: postgresql://osiris:osiris@localhost:5432/osiris_test
      OSIRIS_TEST_REDIS_URL: redis://localhost:6379/1
      PGPASSWORD: osiris
    steps:
      - uses: actions/checkout@v4
      - name: Araç zinciri (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: osiris-server (release)
        run: cargo build --release --locked -p osiris-server
      - name: Migration'lar — psql (docker initdb yolu) ve osiris-server migrate, ikişer kez
        run: |
          psql -h localhost -U osiris -d osiris_test -qc "CREATE DATABASE osiris_psql_test"
          for pass in 1 2; do
            for f in db/migrations/*.sql; do
              psql -h localhost -U osiris -d osiris_psql_test -v ON_ERROR_STOP=1 -q -f "$f"
            done
            target/release/osiris-server --database-url "$OSIRIS_TEST_DATABASE_URL" migrate
          done
      - name: ONNX modelleri (önbellekli; sabit revizyon + özet doğrulaması)
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-${{ hashFiles('crates/osiris-pipeline/src/models.rs') }}
      - name: Modelleri indir / doğrula
        run: target/release/osiris-server models --dir models
      - name: Entegrasyon + model fixture'ları (NER, embedding)
        env:
          OSIRIS_MODEL_DIR: models
          OSIRIS_REQUIRE_MODELS: "1"
        run: |
          cargo test --release --locked -p osiris-server --test integration
          cargo test --release --locked -p osiris-pipeline --test models
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sözleşme (kara kutu) testleri — gerçek API'ye karşı
        env:
          OSIRIS_API_KEY: ci-contract-admin-key-0123456789abcdef
          OSIRIS_JWT_SECRET: ci-contract-jwt-secret-0123456789abcdef
          OSIRIS_DATABASE_URL: postgresql://osiris:osiris@localhost:5432/osiris_test
          OSIRIS_REDIS_URL: redis://localhost:6379/0
          OSIRIS_BASE_URL: http://127.0.0.1:8000
          OSIRIS_CONTRACT_API_KEY: ci-contract-admin-key-0123456789abcdef
          OSIRIS_CONTRACT_DESTRUCTIVE: "1"
        run: |
          pip install -r tests/contract/requirements.txt
          target/release/osiris-server api --addr 127.0.0.1:8000 > api.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          pytest -q tests/contract || { cat api.log; exit 1; }
          target/release/osiris-server --database-url "$OSIRIS_DATABASE_URL" audit-verify --limit 100000

  docker:
    name: İmaj (distroless) derleme ve duman testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: docker build -f deploy/docker/Dockerfile -t osiris:ci .
      - name: Duman testi
        run: |
          docker run --rm osiris:ci --version
          docker run --rm --entrypoint osiris osiris:ci plugins
          docker run --rm osiris:ci api 2>&1 | grep -q "OSIRIS_API_KEY tanımlı değil"
          docker image ls osiris:ci

  cargo-deny:
    name: Rust bağımlılık denetimi (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  tools-and-docs:
    name: Araçlar, sözleşme testleri lint'i, doküman linkleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: pip install ruff -r tools/requirements.txt -r tests/contract/requirements.txt
      - name: Ruff (sözleşme testleri + geliştirme araçları)
        run: ruff check tests tools plugins/username-search/tools
      - name: Üretilmiş tablolar güncel mi (bs4 → content_hash, feedparser → rss)
        run: |
          python tools/gen_html_tables.py --check
          python tools/gen_feed_tables.py --check
      - name: Döküman link kontrolü
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path
          bad = []
          for f in [*Path('.').glob('README*.md'), *Path('docs').glob('*.md'), *Path('.').glob('*/README.md')]:
              # Kod blokları ve satır içi kod bağlantı değildir (regex vb. yanlış pozitif verir)
              text = re.sub(r'```.*?```', '', f.read_text(), flags=re.S)
              text = re.sub(r'`[^`\n]*`', '', text)
              for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  link = m.group(1)
                  if link.startswith(('http', '#', 'mailto:')):
                      continue
                  if not (f.parent / link.split('#')[0]).exists():
                      bad.append(f'{f} -> {link}')
          if bad:
              raise SystemExit('Kırık linkler:\n' + '\n'.join(bad))
          print('Döküman linkleri OK')
          PYEOF
      - name: pip-audit (sözleşme testleri ve araç bağımlılıkları)
        run: |
          pip install pip-audit
          pip-audit -r tests/contract/requirements.txt -r tools/requirements.txt

  web-ui-build:
    name: Web UI derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bağımlılıkları kur
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: osiris-web-ui
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: osiris-web-ui
      - name: Derle
        run: npm run build
        working-directory: osiris-web-ui
      - name: Demo paketini derle (VITE_DEMO=1)
        run: VITE_DEMO=1 npm run build:demo
        working-directory: osiris-web-ui
      - name: Demo kodu üretim paketine girmemeli
        run: "! grep -l exampleleakforum dist/assets/*.js"
        working-directory: osiris-web-ui
      - name: Güvenlik denetimi (npm audit)
        run: npm audit --omit=dev
        working-directory: osiris-web-ui
