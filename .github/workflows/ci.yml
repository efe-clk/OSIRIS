name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-tests:
    name: Python testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: |
          pip install -e ./osiris-sdk
          pip install -e ./osiris-collector
          pip install -e ./osiris-pipeline
          pip install -e ./osiris-graph
          pip install -e ./osiris-alert
          pip install -e ./osiris-report
          pip install -e ./osiris-query
          pip install -e ./osiris-api
          pip install -e ./osiris-cli
          pip install pytest pytest-cov httpx
      - name: Plugin bağımlılıkları
        run: |
          for req in plugins/*/requirements.txt; do pip install -r "$req"; done
      - name: Testleri çalıştır (%80 kapsam eşiği)
        run: |
          pytest -q \
            --cov=osiris --cov=osiris_collector --cov=osiris_pipeline \
            --cov=osiris_graph --cov=osiris_alert --cov=osiris_report \
            --cov=osiris_query --cov=osiris_api --cov=osiris_cli \
            --cov-report=term-missing --cov-fail-under=80

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff kur
        run: pip install ruff
      - name: Lint çalıştır
        run: ruff check osiris-sdk osiris-collector osiris-pipeline osiris-graph osiris-alert osiris-report osiris-query osiris-api osiris-cli plugins tests
      - name: Döküman link kontrolü
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path
          bad = []
          for f in [*Path('.').glob('README*.md'), *Path('docs').glob('*.md')]:
              for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', f.read_text()):
                  link = m.group(1)
                  if link.startswith(('http', '#', 'mailto:')):
                      continue
                  if not (f.parent / link).exists():
                      bad.append(f'{f} -> {link}')
          if bad:
              raise SystemExit('Kırık linkler:\n' + '\n'.join(bad))
          print('Döküman linkleri OK')
          EOF

  security-audit:
    name: Güvenlik denetimi (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit kur ve çalıştır
        run: |
          pip install pip-audit
          pip-audit --desc --local --skip-editable || true

  cpp-build:
    name: C++ derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev nlohmann-json3-dev
      - name: Yapılandır ve derle
        run: cmake -S osiris-core -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Duman testi
        run: ./build/osiris-core --version

  web-ui-build:
    name: Web UI derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bağımlılıkları kur
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: osiris-web-ui
      - name: Derle
        run: npm run build
        working-directory: osiris-web-ui
      - name: Güvenlik denetimi (npm audit)
        run: npm audit --omit=dev
        working-directory: osiris-web-ui
