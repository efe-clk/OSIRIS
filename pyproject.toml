[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # satır uzunluğu bilinçli kapalı (URL/SQL okunabilirliği)
    "B008",  # FastAPI Depends-enjeksiyonu resmi desendir, yanlış pozitif
]

[tool.pytest.ini_options]
testpaths = [
    "osiris-sdk/tests",
    "osiris-collector/tests",
    "osiris-pipeline/tests",
    "osiris-graph/tests",
    "osiris-alert/tests",
    "osiris-report/tests",
    "osiris-query/tests",
    "osiris-api/tests",
    "osiris-cli/tests",
    "plugins/irc/tests",
    "plugins/tor/tests",
    "plugins/username-search/tests",
    "tests/golden",
    "tests/integration",
    "tests/contract",
]
